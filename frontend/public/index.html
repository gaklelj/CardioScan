<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- Favicon & iconsы -->
    <link rel="icon" type="image/jpeg" href="%PUBLIC_URL%/Logo.jpg" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/Logo.jpg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Viewport -->
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!-- Theme color (dark default) -->

    <meta name="twitter:image" content="%PUBLIC_URL%/Logo.jpg" />
