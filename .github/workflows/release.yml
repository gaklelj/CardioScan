name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'CardioScan ${{ github.ref_name }}'
          releaseBody: |
            ## CardioScan ${{ github.ref_name }}

            ### Скачать:
            | Платформа | Файл |
            |---|---|
            | macOS (Apple Silicon) | `CardioScan_*_aarch64.dmg` |
            | macOS (Intel) | `CardioScan_*_x64.dmg` |
            | Windows | `CardioScan_*_x64-setup.exe` |
            | Linux | `CardioScan_*_amd64.AppImage` |

            **macOS:** открой `.dmg`, перетащи в Applications. При первом запуске: `Control+клик → Открыть`
            **Windows:** запусти `.exe` установщик
            **Linux:** сделай файл исполняемым: `chmod +x *.AppImage && ./*.AppImage`
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
