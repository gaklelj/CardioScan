name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      # ── Build bundled Python backend (Windows only) ───────────────────────
      - name: Build Python backend (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          pip install -r backend/requirements.txt
          cd backend
          pyinstaller --onefile --name backend --distpath dist `
            --hidden-import=tensorflow `
            --hidden-import=flask_socketio `
            --add-data "model;model" `
            start.py
          cd ..
          New-Item -ItemType Directory -Force -Path "frontend\src-tauri\binaries"
          Copy-Item "backend\dist\backend.exe" "frontend\src-tauri\binaries\backend-x86_64-pc-windows-msvc.exe"

      # Create empty placeholder binaries for non-Windows platforms
      # so Tauri bundler doesn't fail on externalBin
      - name: Create backend placeholder (macOS arm64)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target aarch64-apple-darwin'
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/backend-aarch64-apple-darwin
          chmod +x frontend/src-tauri/binaries/backend-aarch64-apple-darwin

      - name: Create backend placeholder (macOS x64)
        if: matrix.platform == 'macos-latest' && matrix.args == '--target x86_64-apple-darwin'
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/backend-x86_64-apple-darwin
          chmod +x frontend/src-tauri/binaries/backend-x86_64-apple-darwin

      - name: Create backend placeholder (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          mkdir -p frontend/src-tauri/binaries
          printf '#!/bin/sh\n' > frontend/src-tauri/binaries/backend-x86_64-unknown-linux-gnu
          chmod +x frontend/src-tauri/binaries/backend-x86_64-unknown-linux-gnu

      # ─────────────────────────────────────────────────────────────────────
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'CardioScan ${{ github.ref_name }}'
          releaseBody: |
            ## CardioScan ${{ github.ref_name }}

            ### Скачать:
            | Платформа | Файл | Устройства |
            |---|---|---|
            | 🍎 macOS Apple Silicon | `CardioScan_*_aarch64.dmg` | MacBook M1/M2/M3/M4 |
            | 🍎 macOS Intel | `CardioScan_*_x64.dmg` | MacBook до 2020 |
            | 🪟 Windows | `CardioScan_*_x64-setup.exe` | Windows 10/11 x64 |
            | 🐧 Linux | `CardioScan_*_amd64.AppImage` | Ubuntu, Debian и др. |
            | 📱 iOS | `CardioScan-iOS.ipa` | iPhone / iPad |
            | 🤖 Android | `CardioScan-Android-arm64.apk` | Samsung, Xiaomi, Pixel и др. |

            ---

            ### Установка
            **macOS** — открой DMG, перетащи в Applications. Первый запуск: правый клик → Открыть → Открыть
            **Windows** — запусти `.exe` установщик, бэкенд запускается автоматически
            **Linux** — `chmod +x *.AppImage && ./*.AppImage`
            **iOS** — через AltStore, Sideloadly или Apple Configurator 2
            **Android** — включи «Установку из неизвестных источников» и открой APK
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  build-android:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "NDK_HOME=$ANDROID_SDK_ROOT/ndk/27.0.12077973" >> $GITHUB_ENV

      - name: Create Android placeholder binaries
        run: |
          mkdir -p frontend/src-tauri/binaries
          touch frontend/src-tauri/binaries/backend-aarch64-linux-android
          touch frontend/src-tauri/binaries/backend-armv7-linux-androideabi
          touch frontend/src-tauri/binaries/backend-i686-linux-android
          touch frontend/src-tauri/binaries/backend-x86_64-linux-android

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Initialize Android project
        working-directory: frontend
        run: npx tauri android init

      - name: Build Android APK
        working-directory: frontend
        run: npx tauri android build --apk

      - name: Sign APK
        run: |
          APKSIGNER=$(ls $ANDROID_SDK_ROOT/build-tools/*/apksigner | sort -V | tail -1)
          APK_IN="frontend/src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk"
          APK_OUT="CardioScan-Android-arm64.apk"
          keytool -genkeypair -v -keystore debug.keystore -alias androiddebugkey \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            -storepass android -keypass android 2>/dev/null || true
          "$APKSIGNER" sign \
            --ks debug.keystore \
            --ks-key-alias androiddebugkey \
            --ks-pass pass:android \
            --key-pass pass:android \
            --out "$APK_OUT" "$APK_IN"

      - name: Upload Android APK to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload ${{ github.ref_name }} CardioScan-Android-arm64.apk --clobber
