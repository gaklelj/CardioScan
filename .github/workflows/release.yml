name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
          - platform: windows-latest
            args: ''
          - platform: ubuntu-22.04
            args: ''

    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libudev-dev

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: 'CardioScan ${{ github.ref_name }}'
          releaseBody: |
            ## CardioScan ${{ github.ref_name }}

            ### Скачать:
            | Платформа | Файл | Устройства |
            |---|---|---|
            | 🍎 macOS Apple Silicon | `CardioScan_*_aarch64.dmg` | MacBook M1/M2/M3/M4 |
            | 🍎 macOS Intel | `CardioScan_*_x64.dmg` | MacBook до 2020 |
            | 🪟 Windows | `CardioScan_*_x64-setup.exe` | Windows 10/11 x64 |
            | 🐧 Linux | `CardioScan_*_amd64.AppImage` | Ubuntu, Debian и др. |
            | 📱 iOS | `CardioScan-iOS.ipa` | iPhone / iPad |
            | 🤖 Android | `CardioScan-Android-arm64.apk` | Samsung, Xiaomi, Pixel и др. |

            ---

            ### Установка
            **macOS** — открой DMG, перетащи в Applications. Первый запуск: правый клик → Открыть → Открыть
            **Windows** — запусти `.exe` установщик
            **Linux** — `chmod +x *.AppImage && ./*.AppImage`
            **iOS** — через AltStore, Sideloadly или Apple Configurator 2
            **Android** — включи «Установку из неизвестных источников» и открой APK

            ---

            ### Возможности
            - **ЭКГ в реальном времени** — canvas, Keras AI (6 классов), автоанализ каждые 1000 точек
            - **Анализ фото ЭКГ** — Roboflow CV, зум-модалка, мини-отчёт (на всех платформах)
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
